<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <!-- Background Plate -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Toolpath Circles / Okuma Pattern -->
  <circle cx="32" cy="36" r="18" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6"/>
  <circle cx="32" cy="36" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Bolt Hole Pattern Dots -->
  <circle cx="32" cy="18" r="2.2" fill="#38bdf8"/>
  <circle cx="50" cy="36" r="2.2" fill="#38bdf8"/>
  <circle cx="32" cy="54" r="2.2" fill="#38bdf8"/>
  <circle cx="14" cy="36" r="2.2" fill="#38bdf8"/>
  
  <!-- Center Endmill Cutter -->
  <path d="M28 8 L36 8 L36 22 L32 26 L28 22 Z" fill="url(#toolGrad)" stroke="#475569" stroke-width="1"/>
  <line x1="30" y1="8" x2="30" y2="20" stroke="#64748b" stroke-width="0.8"/>
  <line x1="34" y1="8" x2="34" y2="20" stroke="#64748b" stroke-width="0.8"/>
  
  <!-- "OSP" Badge Text -->
  <rect x="18" y="44" width="28" height="12" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
  <text x="32" y="53" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">OSP</text>
</svg>
